# Configuration for single-model deployment
# The same model instance serves as both the defense reasoning agent and the target assistant.

reasoning_model:
  backend: "vllm" # Set to "vllm" for live model, or "simulated" for offline test
  model: "deepseek-v4-flash"
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  temperature: 0.0
  max_tokens: 1500
  max_context_tokens: 32768
  max_repair_retries: 1

target_model:
  backend: "vllm" # Set to "vllm" for live model, or "simulated" for offline test
  model: "deepseek-v4-flash"
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  system_prompt: "You are a helpful, knowledgeable biological science and research assistant."
  temperature: 0.7
  max_tokens: 2048
